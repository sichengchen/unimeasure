name: Release CRX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-crx-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(node -e "const fs=require('node:fs');process.stdout.write(JSON.parse(fs.readFileSync('manifest.json')).version)")"
          tag_version="${RELEASE_TAG#v}"
          if [[ "$RELEASE_TAG" != v* || "$tag_version" != "$manifest_version" ]]; then
            echo "Release tag $RELEASE_TAG must equal v$manifest_version from manifest.json." >&2
            exit 1
          fi

      - name: Restore CRX signing key
        shell: bash
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$CRX_PRIVATE_KEY_BASE64" ]]; then
            echo "Repository secret CRX_PRIVATE_KEY_BASE64 is required." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/unimeasure.pem"
          printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "UNIMEASURE_CRX_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Test
        run: pnpm test

      - name: Package CRX3
        run: pnpm package:crx

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: UniMeasure-${{ env.RELEASE_TAG }}-crx
          path: artifacts/*.crx
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.crx \
            --verify-tag \
            --generate-notes \
            --title "UniMeasure $RELEASE_TAG"
