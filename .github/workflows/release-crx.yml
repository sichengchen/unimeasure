name: Cut CRX Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump before building the CRX
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: cut-crx-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      CHROME_PATH: /usr/bin/google-chrome
      BUMP_TYPE: ${{ inputs.bump }}

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Bump release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Cut CRX Release must be dispatched from a branch." >&2
            exit 1
          fi
          version="$(node scripts/bump-version.mjs "$BUMP_TYPE")"
          release_tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$release_tag"; then
            echo "Release tag $release_tag already exists." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Test and build bumped version
        run: pnpm check

      - name: Restore CRX signing key
        shell: bash
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$CRX_PRIVATE_KEY_BASE64" ]]; then
            echo "Repository secret CRX_PRIVATE_KEY_BASE64 is required." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/unimeasure.pem"
          printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "UNIMEASURE_CRX_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Package CRX3
        run: pnpm package:crx

      - name: Commit and tag release version
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json dist
          git commit -m "chore: bump version to $RELEASE_VERSION" \
            -m "Co-Authored-By: Sicheng Chen (bot) <gh-bot@scchan.com>"
          git tag "$RELEASE_TAG"
          git push origin "HEAD:${GITHUB_REF_NAME}" "$RELEASE_TAG"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: UniMeasure-${{ env.RELEASE_TAG }}-crx
          path: artifacts/*.crx
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.crx \
            --verify-tag \
            --generate-notes \
            --title "UniMeasure $RELEASE_TAG"
